<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>盤點系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS (Excel 解析) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase 8.x SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body id="appBody" class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-20 transition-colors duration-300">

  <!-- 頂部導覽列 (隨角色切換背景色) -->
  <header id="appHeader" class="bg-indigo-900 text-white sticky top-0 z-30 shadow-md transition-colors duration-300">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center gap-2">
      <div class="flex items-center space-x-2 shrink-0">
        <i class="fa-solid fa-boxes-packing text-amber-400 text-xl"></i>
        <h1 class="font-bold text-lg tracking-wide">盤點系統</h1>
      </div>
      
      <div class="flex items-center space-x-2 flex-wrap justify-end">
        <!-- 角色視圖選單 (依操作人員權限自動鎖定或開放) -->
        <select id="roleSelect" onchange="handleRoleSwitch(this.value)" class="bg-black/30 text-white text-xs font-bold border border-white/30 rounded-lg px-2 py-1.5 focus:outline-none">
          <option value="qc" class="text-slate-800 bg-white">權限：品管人員 (QC)</option>
          <option value="warehouse" class="text-slate-800 bg-white">權限：倉管人員 (Warehouse)</option>
          <option value="buyer" class="text-slate-800 bg-white">權限：採購人員 (Purchasing)</option>
          <option value="admin" class="text-slate-800 bg-white">權限：管理員 (Admin)</option>
        </select>

        <!-- 管理員專屬功能按鈕 -->
        <div id="adminControls" class="flex items-center gap-1.5 hidden">
          <button onclick="openImportModal()" class="bg-white/20 hover:bg-white/30 px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition" title="匯入主檔">
            <i class="fa-solid fa-file-import"></i> 匯入
          </button>
          <button onclick="openPersonnelModal()" class="bg-white/20 hover:bg-white/30 px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition" title="人員管理">
            <i class="fa-solid fa-user-gear"></i> 人員
          </button>
          <button onclick="toggleGlobalLock()" id="globalLockBtn" class="bg-amber-600 hover:bg-amber-500 px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
            <i class="fa-solid fa-lock"></i> 全域鎖定
          </button>
          <button onclick="confirmClearAllData()" class="bg-rose-700 hover:bg-rose-600 px-2 py-1.5 rounded-lg text-xs font-semibold transition" title="清空雲端資料">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>

        <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-500 px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
          <i class="fa-solid fa-file-export"></i> 匯出
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-3 pt-3">
    <!-- 全域鎖定提示條 -->
    <div id="globalLockNotice" class="hidden bg-amber-500 text-white font-bold text-xs p-2.5 rounded-xl shadow-sm mb-3 flex items-center justify-between">
      <span><i class="fa-solid fa-lock mr-1.5"></i> 【系統已全域鎖定】管理員已封存盤點資料，所有輸入與修改功能均已停用 (唯讀模式)。</span>
    </div>

    <!-- 盤點人員選擇列 (選擇後自動連動對應權限頁面) -->
    <div class="bg-white rounded-xl shadow-sm p-3 mb-3 border border-slate-200 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <label class="text-xs font-bold text-slate-600 shrink-0"><i class="fa-solid fa-clipboard-user text-indigo-600 mr-1"></i>當前操作人員：</label>
        <select id="auditorSelect" onchange="handleAuditorChange(this.value)" class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2 font-medium">
        </select>
      </div>
      <div class="text-xs text-slate-500 flex items-center gap-2">
        <span id="roleBadge" class="bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full font-bold">品管人員模式</span>
        <span id="syncStatus" class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
        <span id="savedTimeNotice" class="font-semibold text-slate-700">連線中</span>
      </div>
    </div>

    <!-- 儀表板 Dashboard -->
    <div class="grid grid-cols-4 gap-2 mb-3 text-center">
      <div class="bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-slate-500">總品項</div>
        <div id="statTotal" class="text-lg font-black text-slate-800">0</div>
      </div>
      <div class="bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-slate-500">已盤點</div>
        <div id="statCompleted" class="text-lg font-black text-indigo-600">0</div>
      </div>
      <div class="bg-white p-2.5 rounded-xl border border-emerald-200 shadow-sm bg-emerald-50/30">
        <div class="text-xs text-emerald-600">正常</div>
        <div id="statNormal" class="text-lg font-black text-emerald-600">0</div>
      </div>
      <div class="bg-white p-2.5 rounded-xl border border-rose-200 shadow-sm bg-rose-50/30">
        <div class="text-xs text-rose-600">異常 / 盤差</div>
        <div id="statAbnormal" class="text-lg font-black text-rose-600">0</div>
      </div>
    </div>

    <!-- 進度條 -->
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 mb-3">
      <div class="flex justify-between items-center text-xs text-slate-600 font-semibold mb-1">
        <span>整體盤點進度</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
        <div id="progressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- 搜尋與篩選工具列 -->
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 mb-3 space-y-2">
      <div class="flex flex-wrap gap-2">
        <div class="relative flex-1 min-w-[160px]">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
          <input type="text" id="searchInput" oninput="handleFilterChange()" placeholder="搜尋 SKU、品名、批號、儲存地點或公司..." class="w-full pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-indigo-500 focus:outline-none">
        </div>
        <select id="companyFilter" onchange="handleFilterChange()" class="bg-slate-50 border border-slate-300 text-xs rounded-lg px-2 py-1.5 focus:outline-none font-medium text-slate-700">
          <option value="all">全部公司</option>
        </select>
        <select id="statusFilter" onchange="handleFilterChange()" class="bg-slate-50 border border-slate-300 text-xs rounded-lg px-2 py-1.5 focus:outline-none">
          <option value="all">全部狀態</option>
          <option value="pending">待盤點</option>
          <option value="completed">已盤點</option>
          <option value="discrepancy">帳實不符(盤差)</option>
          <option value="abnormal">品質異常</option>
        </select>
        <select id="pageSizeSelect" onchange="handlePageSizeChange(this.value)" class="bg-slate-50 border border-slate-300 text-xs rounded-lg px-2 py-1.5 focus:outline-none font-semibold text-indigo-700" title="設定每頁顯示品項數量">
          <option value="20" selected>每頁 20 筆</option>
          <option value="50">每頁 50 筆</option>
          <option value="100">每頁 100 筆</option>
          <option value="all">全部顯示</option>
        </select>
      </div>

      <div class="flex justify-between items-center pt-1 border-t border-slate-100 text-xs">
        <div class="flex items-center gap-2">
          <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)" class="w-4 h-4 text-indigo-600 rounded">
          <label for="selectAllCheckbox" class="text-slate-600">全選本頁品項</label>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="toggleExpandAll()" class="text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1">
            <i id="expandAllIcon" class="fa-solid fa-angles-down"></i>
            <span id="expandAllBtnText">展開本頁</span>
          </button>
          <button id="batchDeleteBtn" onclick="deleteSelectedItems()" class="hidden bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1 rounded text-xs transition">
            <i class="fa-solid fa-trash-can mr-1"></i>刪除選取 (<span id="selectedCount">0</span>)
          </button>
        </div>
      </div>
    </div>

    <!-- 品項列表卡片區 -->
    <div id="itemList" class="space-y-2"></div>

    <!-- 分頁導覽控制列 -->
    <div id="paginationControls" class="hidden bg-white p-3 rounded-xl shadow-sm border border-slate-200 mt-3 flex flex-wrap items-center justify-between gap-2 text-xs">
      <div id="paginationInfo" class="text-slate-600 font-medium">顯示第 1 - 20 筆，共 0 筆</div>
      <div class="flex items-center gap-1.5">
        <button id="prevPageBtn" onclick="changePage(currentPage - 1)" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold disabled:opacity-40 disabled:pointer-events-none transition">
          <i class="fa-solid fa-chevron-left mr-1"></i>上一頁
        </button>
        <span id="pageIndicator" class="px-2.5 py-1.5 font-bold text-indigo-700 bg-indigo-50 rounded-lg">第 1 / 1 頁</span>
        <button id="nextPageBtn" onclick="changePage(currentPage + 1)" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold disabled:opacity-40 disabled:pointer-events-none transition">
          下一頁<i class="fa-solid fa-chevron-right ml-1"></i>
        </button>
      </div>
    </div>

    <!-- 空白狀態提示 -->
    <div id="emptyState" class="hidden text-center py-12 bg-white rounded-xl border border-dashed border-slate-300 p-6">
      <i class="fa-solid fa-cloud-arrow-up text-4xl text-slate-300 mb-3"></i>
      <h3 class="text-base font-bold text-slate-700">目前無符合條件的庫存資料</h3>
      <p class="text-xs text-slate-500 mt-1 mb-4">請調整搜尋條件，或由管理員點擊上方「匯入」上傳庫存主檔</p>
    </div>
  </main>

  <!-- 照片大圖檢視 Modal -->
  <div id="imageViewerModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4" onclick="closeImageViewer()">
    <div class="relative max-w-full max-h-full">
      <img id="fullImageView" src="" class="max-w-full max-h-[85vh] rounded-lg shadow-2xl object-contain">
      <button onclick="closeImageViewer()" class="absolute -top-4 -right-4 bg-white text-slate-800 rounded-full w-8 h-8 font-bold shadow-lg">✕</button>
    </div>
  </div>

  <!-- 人員與權限管理 Modal -->
  <div id="personnelModal" class="fixed inset-0 bg-black/50 z-40 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2 mb-3">
        <h3 class="font-bold text-slate-800 text-base"><i class="fa-solid fa-users-gear text-indigo-600 mr-1.5"></i>操作人員與權限管理</h3>
        <button onclick="closePersonnelModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="flex gap-2 mb-3">
        <input type="text" id="newPersonInput" placeholder="輸入人員姓名..." class="flex-1 border rounded-lg px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-indigo-500">
        <select id="newPersonRole" class="border rounded-lg px-2 py-1.5 text-xs bg-slate-50 font-bold">
          <option value="qc">品管 (QC)</option>
          <option value="warehouse">倉管 (Warehouse)</option>
          <option value="buyer">採購 (Purchasing)</option>
          <option value="admin">管理員 (Admin)</option>
        </select>
        <button onclick="addPersonnel()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-indigo-700 shrink-0">新增</button>
      </div>
      <div id="personnelList" class="max-h-48 overflow-y-auto divide-y divide-slate-100 border rounded-lg p-2 bg-slate-50"></div>
    </div>
  </div>

  <!-- Excel/CSV 匯入 Modal -->
  <div id="importModal" class="fixed inset-0 bg-black/50 z-40 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-lg w-full p-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2 mb-3">
        <h3 class="font-bold text-slate-800 text-base"><i class="fa-file-excel text-emerald-600 mr-1.5"></i>匯入 Excel / CSV 庫存主檔</h3>
        <button onclick="closeImportModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      
      <div class="space-y-3">
        <div class="bg-indigo-50 p-2.5 rounded-lg text-xs text-indigo-800 flex justify-between items-center gap-2">
          <span>1. 下載標準範例檔 (SKU, 品名, 類別, 儲存地點, 帳面量, 單位, 批號, 有效日期, 公司)</span>
          <button onclick="downloadSampleCSV()" class="bg-indigo-600 text-white px-2 py-1 rounded text-[11px] hover:bg-indigo-700 shrink-0">下載範例</button>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">2. 選擇檔案與編碼設定：</label>
          <div class="flex gap-2 mb-2">
            <select id="encodingSelect" class="bg-slate-50 border text-xs rounded-lg p-1.5 flex-1">
              <option value="auto">自動判定編碼 (推薦)</option>
              <option value="Big5">Big5 (微軟 Windows 繁體中文 Excel 預設)</option>
              <option value="UTF-8">UTF-8 (Standard)</option>
            </select>
          </div>
          <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" onchange="handleFileSelect(event)" class="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>

        <div id="importPreviewArea" class="hidden">
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold text-slate-700">解析預覽 (<span id="parsedCount">0</span> 筆)</span>
            <div class="space-x-2 text-xs">
              <label class="cursor-pointer"><input type="radio" name="importMode" value="append" checked> 追加模式</label>
              <label class="cursor-pointer"><input type="radio" name="importMode" value="overwrite"> 覆蓋原資料</label>
            </div>
          </div>
          <div class="max-h-36 overflow-y-auto border rounded-lg text-[11px]">
            <table class="w-full text-left">
              <thead class="bg-slate-100 sticky top-0 text-slate-600">
                <tr><th class="p-1.5">SKU</th><th class="p-1.5">品名</th><th class="p-1.5">批號</th><th class="p-1.5">有效日期</th><th class="p-1.5">公司</th></tr>
              </thead>
              <tbody id="importPreviewTable"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-4 pt-2 border-t">
        <button onclick="closeImportModal()" class="px-3 py-1.5 rounded-lg text-xs text-slate-600 border hover:bg-slate-100">取消</button>
        <button id="confirmImportBtn" onclick="executeImport()" disabled class="px-4 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white disabled:opacity-50 hover:bg-indigo-700">上傳至雲端資料庫</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase API 專案設定資訊
    const firebaseConfig = {
      apiKey: "AIzaSyCjdef4iK_v8e1iHeF8k35zBZ0dtlyhTFI",
      authDomain: "qc-inventory-20d2e.firebaseapp.com",
      databaseURL: "https://qc-inventory-20d2e-default-rtdb.firebaseio.com",
      projectId: "qc-inventory-20d2e",
      storageBucket: "qc-inventory-20d2e.firebasestorage.app",
      messagingSenderId: "249646811006",
      appId: "1:249646811006:web:d914fce0577e3d88c3552f"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 倉管標準儲存地點清單
    const STORAGE_LOCATIONS = [
      "1F成品區",
      "1F冷倉",
      "1F冷倉(外)(A區)",
      "1F倉庫(前)",
      "1F原料區",
      "2F冷倉(F區)",
      "2F倉庫(前)(E區)",
      "2F倉庫(後)(H區)",
      "30號1F",
      "30號2F",
      "其他"
    ];

    // 全局變數
    let inventoryData = [];
    let currentPageItems = [];
    let currentPage = 1;
    let pageSize = 20; // 預設每頁 20 筆
    let personnelList = [
      { name: "張品管", role: "qc" },
      { name: "李倉管", role: "warehouse" },
      { name: "王採購", role: "buyer" },
      { name: "系統管理員", role: "admin" }
    ];
    let selectedAuditor = "張品管";
    let currentRole = "qc"; // 當前檢視/操作角色: 'qc' | 'warehouse' | 'buyer' | 'admin'
    let isAdminVerified = false; // 管理員密碼驗證狀態
    let isGlobalLocked = false;
    let selectedItemIds = new Set();
    let expandedItemIds = new Set();
    let isAllExpanded = false;
    let pendingParsedData = [];
    let currentRawArrayBuffer = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadLocalAuditor();
      renderAuditorOptions();
      syncRoleWithOperator(true);
      initFirebaseListeners();
    });

    function initFirebaseListeners() {
      db.ref('system_settings/isGlobalLocked').on('value', (snapshot) => {
        isGlobalLocked = !!snapshot.val();
        const notice = document.getElementById('globalLockNotice');
        const lockBtn = document.getElementById('globalLockBtn');
        if (isGlobalLocked) {
          notice.classList.remove('hidden');
          lockBtn.innerHTML = `<i class="fa-solid fa-lock-open"></i> 解除全域鎖定`;
          lockBtn.className = "bg-emerald-600 hover:bg-emerald-500 px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition";
        } else {
          notice.classList.add('hidden');
          lockBtn.innerHTML = `<i class="fa-solid fa-lock"></i> 全域鎖定`;
          lockBtn.className = "bg-amber-600 hover:bg-amber-500 px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition";
        }
        renderItemList();
      });

      db.ref('inventory_items').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          inventoryData = Object.keys(data).map(key => ({
            id: key,
            ...data[key]
          }));
        } else {
          inventoryData = [];
        }
        document.getElementById('savedTimeNotice').innerText = '已同步：' + new Date().toLocaleTimeString('zh-TW');
        updateCompanyFilterOptions();
        renderItemList();
      }, (error) => {
        console.error("Firebase 連線錯誤:", error);
        document.getElementById('syncStatus').className = "inline-block w-2 h-2 rounded-full bg-rose-500";
        document.getElementById('savedTimeNotice').innerText = '連線失敗(請檢查權限)';
      });

      db.ref('personnel_list').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data && Array.isArray(data)) {
          personnelList = data.map(item => typeof item === 'string' ? { name: item, role: 'qc' } : item);
          syncRoleWithOperator(true);
          renderAuditorOptions();
          renderItemList();
        }
      });
    }

    // 載入本機記憶的操作人員
    function loadLocalAuditor() {
      const storedA = localStorage.getItem('qc_selected_auditor');
      if (storedA) selectedAuditor = storedA;
    }

    // 初始載入或名單更新時，確保當前操作人員與權限狀態安全同步
    function syncRoleWithOperator(isInitial = false) {
      let person = personnelList.find(p => p.name === selectedAuditor);
      if (!person && personnelList.length > 0) {
        person = personnelList.find(p => p.role !== 'admin') || personnelList[0];
        selectedAuditor = person.name;
      }

      if (person) {
        if (person.role === 'admin' && !isAdminVerified) {
          const nonAdmin = personnelList.find(p => p.role !== 'admin');
          if (isInitial && nonAdmin) {
            selectedAuditor = nonAdmin.name;
            currentRole = nonAdmin.role;
          } else {
            currentRole = 'qc';
          }
        } else if (person.role !== 'admin') {
          isAdminVerified = false;
          currentRole = person.role;
        }
      }
      updateRoleUI();
    }

    // 切換「當前操作人員」時的權限檢查與頁面自動連動
    function handleAuditorChange(newName) {
      const targetPerson = personnelList.find(p => p.name === newName);
      if (!targetPerson) return;

      if (targetPerson.role === 'admin') {
        if (!isAdminVerified) {
          const pin = prompt(`【管理員身份驗證】切換至「${targetPerson.name}」需輸入管理員通行密碼：`, "");
          if (pin === "8888") {
            isAdminVerified = true;
            selectedAuditor = targetPerson.name;
            currentRole = "admin";
            localStorage.setItem('qc_selected_auditor', selectedAuditor);
            alert("管理員身份驗證成功！已解鎖全權限與所有頁面切換功能。");
          } else {
            alert("密碼錯誤！無法切換至管理員身份。");
            document.getElementById('auditorSelect').value = selectedAuditor;
            return;
          }
        } else {
          selectedAuditor = targetPerson.name;
          currentRole = "admin";
          localStorage.setItem('qc_selected_auditor', selectedAuditor);
        }
      } else {
        isAdminVerified = false;
        selectedAuditor = targetPerson.name;
        currentRole = targetPerson.role;
        localStorage.setItem('qc_selected_auditor', selectedAuditor);
      }

      updateRoleUI();
      updateBatchDeleteBtn();
      renderItemList();
    }

    // 右上角頁面視圖切換（僅已驗證的管理員可自由切換各部門頁面預覽/稽核）
    function handleRoleSwitch(targetRole) {
      const activePerson = personnelList.find(p => p.name === selectedAuditor);
      const canSwitchAll = activePerson && activePerson.role === 'admin' && isAdminVerified;

      if (!canSwitchAll) {
        alert("權限不足！只有「管理員」身份且通過密碼驗證後，才能切換檢視其他部門的頁面。");
        document.getElementById('roleSelect').value = currentRole;
        return;
      }

      currentRole = targetRole;
      updateRoleUI();
      updateBatchDeleteBtn();
      renderItemList();
    }

    function updateRoleUI() {
      const adminControls = document.getElementById('adminControls');
      const roleBadge = document.getElementById('roleBadge');
      const header = document.getElementById('appHeader');
      const body = document.getElementById('appBody');
      const roleSelect = document.getElementById('roleSelect');

      const activePerson = personnelList.find(p => p.name === selectedAuditor);
      const canSwitchAll = activePerson && activePerson.role === 'admin' && isAdminVerified;

      roleSelect.value = currentRole;
      Array.from(roleSelect.options).forEach(opt => {
        opt.disabled = canSwitchAll ? false : (opt.value !== currentRole);
      });

      header.classList.remove('bg-indigo-900', 'bg-emerald-900', 'bg-amber-900', 'bg-purple-950');
      body.classList.remove('bg-slate-100', 'bg-emerald-50/50', 'bg-amber-50/40', 'bg-purple-50/40');

      if (currentRole === 'admin') {
        header.classList.add('bg-purple-950');
        body.classList.add('bg-purple-50/40');
        adminControls.classList.remove('hidden');
        roleBadge.innerText = '系統管理員 (全權限)';
        roleBadge.className = 'bg-purple-100 text-purple-800 px-2 py-0.5 rounded-full font-bold';
      } else {
        adminControls.classList.add('hidden');
        if (currentRole === 'qc') {
          header.classList.add('bg-indigo-900');
          body.classList.add('bg-slate-100');
          roleBadge.innerText = '品管人員模式';
          roleBadge.className = 'bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full font-bold';
        } else if (currentRole === 'warehouse') {
          header.classList.add('bg-emerald-900');
          body.classList.add('bg-emerald-50/50');
          roleBadge.innerText = '倉管人員模式';
          roleBadge.className = 'bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold';
        } else if (currentRole === 'buyer') {
          header.classList.add('bg-amber-900');
          body.classList.add('bg-amber-50/40');
          roleBadge.innerText = '採購人員模式';
          roleBadge.className = 'bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold';
        }
      }
    }

    function toggleGlobalLock() {
      if (currentRole !== 'admin') return;
      const targetState = !isGlobalLocked;
      const msg = targetState 
        ? "確定要【全域鎖定】系統嗎？鎖定後所有手機將無法修改任何紀錄。" 
        : "確定要解除全域鎖定嗎？";
      if (confirm(msg)) {
        db.ref('system_settings/isGlobalLocked').set(targetState);
      }
    }

    function toggleBuyerLock(id) {
      if (currentRole !== 'buyer' && currentRole !== 'admin') return;
      const item = inventoryData.find(i => i.id === id);
      if (!item) return;
      const targetState = !item.lockedByBuyer;
      db.ref(`inventory_items/${id}/lockedByBuyer`).set(targetState);
    }

    function renderAuditorOptions() {
      const select = document.getElementById('auditorSelect');
      const roleMap = { qc: '品管', warehouse: '倉管', buyer: '採購', admin: '管理員' };
      select.innerHTML = personnelList.map(p => {
        const name = typeof p === 'object' ? p.name : p;
        const role = typeof p === 'object' ? p.role : 'qc';
        return `<option value="${name}" ${name === selectedAuditor ? 'selected' : ''}>${name} (${roleMap[role] || '人員'})</option>`;
      }).join('');
    }

    function openPersonnelModal() {
      if (currentRole !== 'admin') { alert('只有管理員可以管理人員名單與權限'); return; }
      renderPersonnelList();
      document.getElementById('personnelModal').classList.remove('hidden');
    }
    function closePersonnelModal() {
      document.getElementById('personnelModal').classList.add('hidden');
      renderAuditorOptions();
    }
    function renderPersonnelList() {
      const listEl = document.getElementById('personnelList');
      const roleNames = { qc: '品管 (QC)', warehouse: '倉管 (Warehouse)', buyer: '採購 (Buyer)', admin: '管理員 (Admin)' };
      const roleColors = { 
        qc: 'bg-indigo-100 text-indigo-800', 
        warehouse: 'bg-emerald-100 text-emerald-800', 
        buyer: 'bg-amber-100 text-amber-800', 
        admin: 'bg-purple-100 text-purple-800' 
      };

      listEl.innerHTML = personnelList.map((p, idx) => `
        <div class="flex justify-between items-center py-1.5 px-2">
          <div class="flex items-center gap-2">
            <span class="text-xs text-slate-800 font-bold">${p.name}</span>
            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${roleColors[p.role] || 'bg-slate-100'}">
              ${roleNames[p.role] || '一般'}
            </span>
          </div>
          <button onclick="removePersonnel(${idx})" class="text-rose-500 hover:text-rose-700 text-xs px-1"><i class="fa-solid fa-trash-can"></i></button>
        </div>
      `).join('');
    }
    function addPersonnel() {
      const input = document.getElementById('newPersonInput');
      const roleSelect = document.getElementById('newPersonRole');
      const name = input.value.trim();
      const role = roleSelect.value;

      if (name && !personnelList.some(p => p.name === name)) {
        personnelList.push({ name: name, role: role });
        db.ref('personnel_list').set(personnelList);
        input.value = '';
        renderPersonnelList();
      } else if (name) {
        alert('該人員姓名已存在！');
      }
    }
    function removePersonnel(idx) {
      if (personnelList.length <= 1) {
        alert('請至少保留一名人員');
        return;
      }
      personnelList.splice(idx, 1);
      db.ref('personnel_list').set(personnelList);
      renderPersonnelList();
    }

    // 動態更新「公司別」篩選選單
    function updateCompanyFilterOptions() {
      const select = document.getElementById('companyFilter');
      if (!select) return;
      const currentVal = select.value;
      const companies = [...new Set(inventoryData.map(i => (i.company || '').trim()).filter(Boolean))];
      
      select.innerHTML = `<option value="all">全部公司</option>` + 
        companies.map(c => `<option value="${c}">${c}</option>`).join('');
      
      if (companies.includes(currentVal)) {
        select.value = currentVal;
      } else {
        select.value = 'all';
      }
    }

    // 分頁與篩選控制函式
    function handleFilterChange() {
      currentPage = 1;
      isAllExpanded = false;
      document.getElementById('expandAllBtnText').innerText = '展開本頁';
      document.getElementById('expandAllIcon').className = 'fa-solid fa-angles-down';
      renderItemList();
    }

    function handlePageSizeChange(val) {
      pageSize = val === 'all' ? 'all' : parseInt(val, 10);
      currentPage = 1;
      isAllExpanded = false;
      document.getElementById('expandAllBtnText').innerText = '展開本頁';
      document.getElementById('expandAllIcon').className = 'fa-solid fa-angles-down';
      renderItemList();
    }

    function changePage(newPage) {
      currentPage = newPage;
      isAllExpanded = false;
      document.getElementById('expandAllBtnText').innerText = '展開本頁';
      document.getElementById('expandAllIcon').className = 'fa-solid fa-angles-down';
      renderItemList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleCardExpand(id) {
      if (expandedItemIds.has(id)) expandedItemIds.delete(id);
      else expandedItemIds.add(id);
      renderItemList();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      if (isAllExpanded) {
        currentPageItems.forEach(item => expandedItemIds.add(item.id));
        document.getElementById('expandAllBtnText').innerText = '收合本頁';
        document.getElementById('expandAllIcon').className = 'fa-solid fa-angles-up';
      } else {
        currentPageItems.forEach(item => expandedItemIds.delete(item.id));
        document.getElementById('expandAllBtnText').innerText = '展開本頁';
        document.getElementById('expandAllIcon').className = 'fa-solid fa-angles-down';
      }
      renderItemList();
    }

    // 渲染倉管儲存地點下拉選項
    function renderLocationOptions(currentLoc) {
      const val = (currentLoc || '').trim();
      let html = '';
      if (!val) {
        html += `<option value="" selected>-- 請選擇儲存地點 --</option>`;
      } else if (!STORAGE_LOCATIONS.includes(val)) {
        html += `<option value="${val}" selected>${val} (原匯入儲位)</option>`;
      }
      html += STORAGE_LOCATIONS.map(loc => 
        `<option value="${loc}" ${val === loc ? 'selected' : ''}>${loc}</option>`
      ).join('');
      return html;
    }

    function renderItemList() {
      const listEl = document.getElementById('itemList');
      const emptyEl = document.getElementById('emptyState');
      const paginationEl = document.getElementById('paginationControls');
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const filter = document.getElementById('statusFilter').value;
      const companyFilter = document.getElementById('companyFilter').value;

      const filtered = inventoryData.filter(item => {
        const matchesSearch = (item.sku || '').toLowerCase().includes(search) || 
                              (item.name || '').toLowerCase().includes(search) || 
                              (item.batchNo || '').toLowerCase().includes(search) || 
                              (item.location || '').toLowerCase().includes(search) ||
                              (item.company || '').toLowerCase().includes(search);
        const matchesCompany = (companyFilter === 'all') || ((item.company || '') === companyFilter);
        let matchesStatus = true;
        const hasDiscrepancy = (item.systemQty !== item.actualQty);
        
        if (filter === 'pending') matchesStatus = !item.audited;
        else if (filter === 'completed') matchesStatus = item.audited;
        else if (filter === 'discrepancy') matchesStatus = hasDiscrepancy;
        else if (filter === 'abnormal') matchesStatus = item.audited && item.condition === 'abnormal';
        
        return matchesSearch && matchesCompany && matchesStatus;
      });

      if (inventoryData.length === 0 || filtered.length === 0) {
        currentPageItems = [];
        listEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
        paginationEl.classList.add('hidden');
        document.getElementById('selectAllCheckbox').checked = false;
        updateDashboard();
        return;
      }

      emptyEl.classList.add('hidden');
      paginationEl.classList.remove('hidden');

      // 計算分頁範圍
      const totalFiltered = filtered.length;
      let totalPages = 1;
      let startIndex = 0;
      let endIndex = totalFiltered;

      if (pageSize !== 'all') {
        totalPages = Math.max(1, Math.ceil(totalFiltered / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;
        startIndex = (currentPage - 1) * pageSize;
        endIndex = Math.min(startIndex + pageSize, totalFiltered);
        currentPageItems = filtered.slice(startIndex, endIndex);
      } else {
        currentPage = 1;
        currentPageItems = filtered;
      }

      // 更新分頁按鈕與頁碼資訊
      document.getElementById('paginationInfo').innerText = `顯示第 ${startIndex + 1} - ${endIndex} 筆，共 ${totalFiltered} 筆`;
      document.getElementById('pageIndicator').innerText = `第 ${currentPage} / ${totalPages} 頁`;
      document.getElementById('prevPageBtn').disabled = (pageSize === 'all' || currentPage <= 1);
      document.getElementById('nextPageBtn').disabled = (pageSize === 'all' || currentPage >= totalPages);

      // 同步「全選本頁品項」勾選框狀態
      const allPageSelected = currentPageItems.length > 0 && currentPageItems.every(item => selectedItemIds.has(item.id));
      document.getElementById('selectAllCheckbox').checked = allPageSelected;

      const todayStr = new Date().toISOString().slice(0, 10);

      listEl.innerHTML = currentPageItems.map(item => {
        const isAudited = item.audited;
        const isAbnormal = isAudited && item.condition === 'abnormal';
        const isChecked = selectedItemIds.has(item.id);
        const isExpanded = expandedItemIds.has(item.id);
        const isExpired = item.expDate && item.expDate < todayStr;
        const hasDiscrepancy = (item.systemQty !== item.actualQty);

        const isWarehouseLocked = isGlobalLocked || item.lockedByBuyer;
        const isQcLocked = isGlobalLocked;
        const isBuyerLocked = isGlobalLocked;

        return `
          <div class="bg-white rounded-xl shadow-sm border ${isAbnormal ? 'border-rose-300 bg-rose-50/20' : hasDiscrepancy ? 'border-amber-300 bg-amber-50/20' : isAudited ? 'border-emerald-200' : 'border-slate-200'} p-3 transition">
            
            <!-- 卡片頂部標頭 (包含 Tailwind 漂浮小黑框提示) -->
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 flex-1 cursor-pointer" onclick="toggleCardExpand('${item.id}')">
                <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleItemSelect('${item.id}', this.checked)" class="w-4 h-4 text-indigo-600 rounded shrink-0">
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    
                    <!-- 1. SKU 標籤 + 小黑框提示 -->
                    <div class="relative group inline-block">
                      <span class="font-mono text-xs font-bold text-slate-600 bg-slate-100 px-1.5 py-0.5 rounded cursor-pointer">${item.sku}</span>
                      <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 hidden group-hover:block bg-slate-800 text-white text-[10px] py-1 px-2 rounded shadow-lg whitespace-nowrap z-10 pointer-events-none">
                        SKU 料號
                      </div>
                    </div>

                    <!-- 2. 儲存地點標籤 + 小黑框提示 -->
                    <div class="relative group inline-block">
                      <span class="text-xs bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded font-semibold cursor-pointer"><i class="fa-solid fa-location-dot mr-1"></i>${item.location || '未指定地點'}</span>
                      <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 hidden group-hover:block bg-slate-800 text-white text-[10px] py-1 px-2 rounded shadow-lg whitespace-nowrap z-10 pointer-events-none">
                        儲存地點
                      </div>
                    </div>

                    <!-- 3. 批號標籤 + 小黑框提示 -->
                    ${item.batchNo ? `
                      <div class="relative group inline-block">
                        <span class="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-1.5 py-0.5 rounded font-mono font-semibold cursor-pointer"><i class="fa-solid fa-barcode mr-1"></i>${item.batchNo}</span>
                        <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 hidden group-hover:block bg-slate-800 text-white text-[10px] py-1 px-2 rounded shadow-lg whitespace-nowrap z-10 pointer-events-none">
                          產品批號
                        </div>
                      </div>
                    ` : ''}

                    <!-- 4. 公司標籤 + 小黑框提示 -->
                    ${item.company ? `
                      <div class="relative group inline-block">
                        <span class="text-xs bg-sky-50 text-sky-700 border border-sky-200 px-1.5 py-0.5 rounded font-semibold cursor-pointer"><i class="fa-solid fa-building mr-1"></i>${item.company}</span>
                        <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 hidden group-hover:block bg-slate-800 text-white text-[10px] py-1 px-2 rounded shadow-lg whitespace-nowrap z-10 pointer-events-none">
                          所屬公司
                        </div>
                      </div>
                    ` : ''}

                    ${item.lockedByBuyer ? `<span class="text-[10px] bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded font-bold"><i class="fa-solid fa-lock mr-0.5"></i>採購已鎖定</span>` : ''}
                    ${hasDiscrepancy ? `<span class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold">盤差: ${item.actualQty - item.systemQty}</span>` : ''}
                  </div>
                  <h2 class="font-bold text-sm text-slate-800 mt-0.5 truncate">${item.name}</h2>
                </div>
              </div>

              <div class="flex items-center gap-2 shrink-0">
                ${isAudited 
                  ? `<span class="px-2 py-0.5 rounded-full text-xs font-bold ${isAbnormal ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">
                      <i class="fa-solid ${isAbnormal ? 'fa-triangle-exclamation' : 'fa-circle-check'} mr-1"></i>${isAbnormal ? '異常' : '正常'}
                     </span>` 
                  : `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-slate-100 text-slate-500">待盤點</span>`}
                <button onclick="toggleCardExpand('${item.id}')" class="text-slate-400 hover:text-indigo-600 p-1 text-sm font-bold" title="${isExpanded ? '收合' : '展開'}">
                  <i class="fa-solid ${isExpanded ? 'fa-chevron-up text-indigo-600' : 'fa-chevron-down'}"></i>
                </button>
                ${currentRole === 'admin' ? `
                  <button onclick="deleteSingleItem('${item.id}')" class="text-slate-400 hover:text-rose-600 p-1 text-xs" title="刪除品項">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                ` : ''}
              </div>
            </div>

            ${isExpanded ? `
              <div class="pt-3 mt-2 border-t border-slate-100 space-y-3">
                
                <!-- 倉管儲存地點下拉選單 -->
                <div>
                  <label class="block text-[11px] font-bold text-slate-500 mb-0.5"><i class="fa-solid fa-warehouse text-emerald-600 mr-1"></i>儲存地點 (倉管/品管)：</label>
                  <select ${isWarehouseLocked ? 'disabled' : ''} onchange="updateItemField('${item.id}', 'location', this.value)" class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs font-semibold bg-white text-slate-800 focus:ring-1 focus:ring-indigo-500 focus:outline-none disabled:bg-slate-100 disabled:text-slate-500">
                    ${renderLocationOptions(item.location)}
                  </select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-0.5">產品批號 (倉管/品管)：</label>
                    <input type="text" value="${item.batchNo || ''}" ${isWarehouseLocked ? 'disabled' : ''} placeholder="請輸入批號..." onblur="updateItemField('${item.id}', 'batchNo', this.value)" class="w-full border border-slate-300 rounded px-2 py-1 text-xs font-mono focus:ring-1 focus:ring-indigo-500 focus:outline-none disabled:bg-slate-100 disabled:text-slate-500">
                  </div>
                  <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-0.5">有效日期 (倉管/品管)：</label>
                    <input type="date" value="${item.expDate || ''}" ${isWarehouseLocked ? 'disabled' : ''} onchange="updateItemField('${item.id}', 'expDate', this.value)" class="w-full border ${isExpired ? 'border-rose-400 bg-rose-50 text-rose-700' : 'border-slate-300'} rounded px-2 py-1 text-xs font-medium focus:ring-1 focus:ring-indigo-500 focus:outline-none disabled:bg-slate-100">
                  </div>
                </div>

                ${isExpired ? `<div class="text-[11px] text-rose-600 font-bold flex items-center gap-1"><i class="fa-solid fa-circle-exclamation"></i> 警告：該有效日期已過期！</div>` : ''}

                <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2 rounded-lg text-xs">
                  <div>
                    <span class="text-slate-500">帳面數量：</span>
                    <span class="font-bold text-slate-700">${item.systemQty} ${item.unit}</span>
                  </div>
                  <div class="flex items-center gap-1">
                    <span class="text-slate-500">實盤數量：</span>
                    <input type="number" value="${item.actualQty ?? item.systemQty}" ${isWarehouseLocked ? 'disabled' : ''} onchange="updateItemField('${item.id}', 'actualQty', parseFloat(this.value)||0)" class="w-20 border rounded px-1.5 py-0.5 text-xs font-bold text-indigo-900 focus:outline-none focus:ring-1 focus:ring-indigo-500 disabled:bg-slate-200">
                    <span class="text-slate-500">${item.unit}</span>
                  </div>
                </div>

                ${(currentRole === 'buyer' || currentRole === 'admin') ? `
                  <div class="bg-amber-50/60 border border-amber-200 p-2.5 rounded-lg text-xs space-y-2">
                    <div class="flex items-center justify-between">
                      <span class="font-bold text-amber-900"><i class="fa-solid fa-cart-shopping mr-1"></i> 採購覆核與鎖定控制：</span>
                      <button onclick="toggleBuyerLock('${item.id}')" ${isBuyerLocked ? 'disabled' : ''} class="px-2.5 py-1 rounded text-xs font-bold ${item.lockedByBuyer ? 'bg-rose-600 text-white' : 'bg-amber-600 text-white'} shadow-sm transition">
                        <i class="fa-solid ${item.lockedByBuyer ? 'fa-lock' : 'fa-lock-open'} mr-1"></i>${item.lockedByBuyer ? '解鎖倉管輸入' : '鎖定倉管輸入'}
                      </button>
                    </div>
                    <div>
                      <input type="text" value="${item.buyerNote || ''}" ${isBuyerLocked ? 'disabled' : ''} placeholder="採購對接說明 (如: 安排退貨、通知廠商補發...)" onblur="updateItemField('${item.id}', 'buyerNote', this.value)" class="w-full border border-amber-300 rounded p-1.5 text-xs bg-white focus:outline-none focus:ring-1 focus:ring-amber-500">
                    </div>
                  </div>
                ` : (item.buyerNote ? `
                  <div class="text-xs bg-amber-50 border border-amber-200 p-2 rounded-lg text-amber-900">
                    <span class="font-bold">採購覆核說明：</span> ${item.buyerNote}
                  </div>
                ` : '')}

    function updateItemField(id, field, value) {
      if (isGlobalLocked) return;

    function updateCondition(id, cond) {
      if (isGlobalLocked) return;
      const updates = { condition: cond };
      if (cond === 'normal') updates.abnormalAction = '';
      db.ref(`inventory_items/${id}`).update(updates);
    }

    function addNoteChip(id, text) {
      if (isGlobalLocked) return;
      const item = inventoryData.find(i => i.id === id);
      if (item) {
        const newNote = item.note ? `${item.note}；${text}` : text;
        db.ref(`inventory_items/${id}/note`).set(newNote);
      }
    }

    function handlePhotoUpload(id, event) {
      if (isGlobalLocked) return;
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxWidth = 800;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.65);
          db.ref(`inventory_items/${id}/photo`).set(compressedBase64);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

        alert('【請選擇處置方式】判定 FAIL 時，必須選擇異常處置方式！');

      db.ref(`inventory_items/${id}`).update({

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

        currentRawArrayBuffer = e.target.result;
        parseSelectedFile();
      };
      reader.readAsArrayBuffer(file);

    // Excel/CSV 解析 (開頭 0 完全保留，並支援最後一欄「公司」)
    function parseSelectedFile() {
      if (!currentRawArrayBuffer) return;
      const encodingChoice = document.getElementById('encodingSelect').value;
      let workbook;
      
      try {
        const readOpts = { type: 'string' };
        if (encodingChoice === 'Big5') {
          const decoder = new TextDecoder('big5');
          workbook = XLSX.read(decoder.decode(currentRawArrayBuffer), readOpts);
        } else if (encodingChoice === 'UTF-8') {
          const decoder = new TextDecoder('utf-8');
          workbook = XLSX.read(decoder.decode(currentRawArrayBuffer), readOpts);
        } else {
          try {
            const decoderUtf8 = new TextDecoder('utf-8', { fatal: true });
            workbook = XLSX.read(decoderUtf8.decode(currentRawArrayBuffer), readOpts);
          } catch(e) {
            const decoderBig5 = new TextDecoder('big5');
            workbook = XLSX.read(decoderBig5.decode(currentRawArrayBuffer), readOpts);
          }
        }
      } catch(err) {
        alert('解析檔案失敗，請檢查編碼格式');
        return;
      }

      const rawJson = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { 
        header: 1, 
        raw: false, 
        defval: '' 
      });

      if (rawJson.length < 2) {
        alert('檔案內容空白或格式不正確');
        return;
      }

      const headers = rawJson[0].map(h => String(h || '').trim().toLowerCase());
      
      let skuIdx = headers.findIndex(h => h.includes('sku') || h.includes('編號') || h.includes('料號'));
      let nameIdx = headers.findIndex(h => h.includes('品名') || h.includes('名稱'));
      let catIdx = headers.findIndex(h => h.includes('類別') || h.includes('分類'));
      let locIdx = headers.findIndex(h => h.includes('儲位') || h.includes('地點') || h.includes('位置') || h.includes('庫位'));
      let qtyIdx = headers.findIndex(h => h.includes('帳面') || h.includes('數量') || h.includes('庫存'));
      let unitIdx = headers.findIndex(h => h.includes('單位'));
      let batchIdx = headers.findIndex(h => h.includes('批號') || h.includes('批次'));
      let expIdx = headers.findIndex(h => h.includes('有效') || h.includes('到期') || h.includes('期限') || h.includes('日期'));
      let compIdx = headers.findIndex(h => h.includes('公司') || h.includes('廠區') || h.includes('company'));

      if (skuIdx === -1) skuIdx = 0;
      if (nameIdx === -1) nameIdx = 1;
      if (catIdx === -1) catIdx = 2;
      if (locIdx === -1) locIdx = 3;
      if (qtyIdx === -1) qtyIdx = 4;
      if (unitIdx === -1) unitIdx = 5;
      if (batchIdx === -1) batchIdx = 6;
      if (expIdx === -1) expIdx = 7;
      if (compIdx === -1 && headers.length > 8) compIdx = 8;

      pendingParsedData = [];

      for (let i = 1; i < rawJson.length; i++) {
        const row = rawJson[i];
        if (!row || row.length === 0) continue;

        const skuVal = String(row[skuIdx] !== undefined ? row[skuIdx] : '').replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
        const nameVal = String(row[nameIdx] !== undefined ? row[nameIdx] : '').trim();
        
        if (!skuVal && !nameVal) continue;

        let rawQty = String(row[qtyIdx] || '0').replace(/[^0-9.-]/g, '');
        let parsedQty = parseFloat(rawQty) || 0;

        let expDateStr = String(row[expIdx] || '').trim();
        if (expDateStr.includes('/')) {
          const parts = expDateStr.split('/');
          if (parts.length === 3) {
            expDateStr = `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
          }
        }

        const compVal = compIdx !== -1 ? String(row[compIdx] !== undefined ? row[compIdx] : '').trim() : '';

        const generatedId = 'item_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        pendingParsedData.push({
          id: generatedId,
          sku: skuVal,
          name: nameVal,
          category: String(row[catIdx] || '原料').trim(),
          location: String(row[locIdx] || '').trim(),
          company: compVal,
          systemQty: parsedQty,
          actualQty: parsedQty,
          unit: String(row[unitIdx] || 'kg').trim(),
          batchNo: String(row[batchIdx] || '').trim(),
          expDate: expDateStr,
          pkgIntact: '是',
          hasLooseStock: '否',
          qualityCheck: '是',
          buyerNote: '',
          lockedByBuyer: false,
          audited: false,
          condition: null,
          abnormalAction: '',
          photo: null,
          note: ''
        });
      }

      document.getElementById('parsedCount').innerText = pendingParsedData.length;
      document.getElementById('importPreviewTable').innerHTML = pendingParsedData.slice(0, 5).map(item => `
        <tr class="border-b">
          <td class="p-1 font-mono">${item.sku}</td>
          <td class="p-1 truncate max-w-[100px]">${item.name}</td>
          <td class="p-1 font-mono">${item.batchNo || '-'}</td>
          <td class="p-1 font-mono">${item.expDate || '-'}</td>
          <td class="p-1">${item.company || '-'}</td>
        </tr>
      `).join('');
      document.getElementById('importPreviewArea').classList.remove('hidden');
      document.getElementById('confirmImportBtn').disabled = false;
    }

    function executeImport() {
      if (pendingParsedData.length === 0) return;
      const mode = document.querySelector('input[name="importMode"]:checked').value;
      const updates = {};

      pendingParsedData.forEach(item => {
        updates[item.id] = item;
      });

      if (mode === 'overwrite') {
        db.ref('inventory_items').set(updates);
      } else {
        db.ref('inventory_items').update(updates);
      }

      closeImportModal();
      alert(`已成功上傳 ${pendingParsedData.length} 筆資料至資料庫！所有連線手機將即時更新。`);
    }

    function exportToCSV() {
      if (inventoryData.length === 0) {
        alert('目前無可匯出的資料！');
        return;
      }
      let csv = '\uFEFFSKU編號,品名,類別,儲存地點,所屬公司,產品批號,有效日期,帳面數量,實盤數量,盤差,單位,包裝是否完好,是否有散貨,品質(包裝樣式/顏色/風味/流動性)正常,盤點狀態,整體品質性狀,異常處置方式,採購覆核說明,倉管資料鎖定,最後操作人員,最後操作時間,品管備註,是否有照片\n';
      inventoryData.forEach(item => {
        const diff = (item.actualQty ?? item.systemQty) - item.systemQty;
        csv += [
          `"${item.sku || ''}"`,
          `"${item.name || ''}"`,
          `"${item.category || ''}"`,
          `"${item.location || ''}"`,
          `"${item.company || ''}"`,
          `"${item.batchNo || ''}"`,
          `"${item.expDate || ''}"`,
          item.systemQty,
          item.actualQty ?? item.systemQty,
          diff,
          `"${item.unit || ''}"`,
          `"${item.pkgIntact || '未判定'}"`,
          `"${item.hasLooseStock || '未判定'}"`,
          `"${item.qualityCheck || '未判定'}"`,
          item.audited ? '已盤點' : '未盤點',
          item.condition === 'normal' ? '正常' : item.condition === 'abnormal' ? '異常' : '未判定',
          `"${item.abnormalAction || ''}"`,
          `"${(item.buyerNote || '').replace(/"/g, '""')}"`,
          item.lockedByBuyer ? '是' : '否',
          `"${item.auditor || ''}"`,
          `"${item.auditTime || ''}"`,
          `"${(item.note || '').replace(/"/g, '""')}"`,
          item.photo ? '是' : '否'
        ].join(',') + '\n';
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `年度庫存盤點總表_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    function downloadSampleCSV() {
